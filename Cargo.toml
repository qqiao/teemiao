[package]
name = "teemiao"
version = "0.2.4"
edition = "2024"
description = "Developer CLI for Git build metadata and installed AI coding-agent updates."
license = "Apache-2.0"
repository = "https://github.com/qqiao/teemiao"
documentation = "https://github.com/qqiao/teemiao#readme"
readme = "README.md"
keywords = ["cli", "build-info", "git", "agents", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
rust-i18n = "4.2.4"
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.10"
gix = "0.83.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
