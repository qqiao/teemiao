_version: 1
cli.about: "Teemiao 是一组用于构建其他应用程序的便捷工具。"
commands.build_info.about: "以 JSON 格式生成构建信息元数据。"
commands.build_info.long_about: "创建一个格式化的 JSON 文件，包含当前仓库缩短后的 HEAD git 修订版本（`revision`）和 UTC Unix 秒级时间戳（`build_time`）。"
commands.config_template.about: "从模板生成配置（尚未实现）。"
commands.config_template.long_about: "此命令将从模板生成配置文件。（目前尚未实现；调用此命令会触发 panic。）"
commands.agents.about: "发现并更新 PATH 中已安装的 AI 编程代理命令行工具。"
commands.agents.long_about: "从当前进程的 PATH 中发现并更新活动的命令行编程代理（Codex、Antigravity、OpenCode、Kimi、Cursor、Claude Code 和 Qoder）。\n\n仅检查 PATH 中的命令行安装，不包含桌面应用和编辑器扩展。如果已安装的代理未显示，请将其可执行文件目录添加到 shell 配置的 PATH 中。"
commands.agents.list.about: "列出在 PATH 中找到的已安装 AI 编程代理命令行工具。"
commands.agents.list.long_about: "检查当前进程 PATH 中受支持的编程代理 CLI（codex、agy、opencode、kimi、agent/cursor-agent、claude、qodercli/qoder），并通过受限的本地版本/帮助探测及包管理器元数据报告每个已检测安装的版本、可执行文件路径和更新方式（不运行更新程序或注册表检查）。"
commands.agents.update.about: "更新指定的已安装编程代理 CLI 或所有检测到的编程代理 CLI。"
commands.agents.update.long_about: "使用经过验证的安装归属管理器并保持现有发布通道，更新单个指定的编程代理 CLI 或 PATH 中检测到的所有编程代理 CLI。每个尝试更新的代理诊断输出会在 stderr 中按 '--- [<index>/<total>] <Name> (<id>) ---' 分段显示，随后在 stdout 中输出分隔的“更新摘要”。\n\n使用 --dry-run 可预览选定的更新命令而不修改已安装的软件。"
agents.update.agent.help: "要更新的代理标准标识符或别名（codex、antigravity/agy、opencode、kimi、cursor、claude-code/claude、qoder/qodercli）。"
agents.update.agent.long_help: "可选的要更新的代理标识符或别名。支持的值：codex、antigravity（别名：agy）、opencode、kimi、cursor、claude-code（别名：claude）、qoder（别名：qodercli）。如果省略，将按目录顺序依次更新 PATH 中检测到的所有代理。"
agents.update.dry_run.help: "预览更新命令和目标，而不修改已安装的软件。"
agents.update.dry_run.long_help: "运行发现和只读归属检查，然后打印每个所选代理的计划更新命令，而不执行更新程序或下载安装器。"
agents.list.empty: "在 PATH 中未找到受支持的 AI 编程代理 CLI。"
